# Compila y ejecuta todas las pruebas con cada push y cada pull request, incluidas las de arquitectura
# (ArquitecturaTest). Si un cambio da a una clase del dominio setters, un constructor público vacío,
# campos mutables o una dependencia de Spring, este trabajo falla y el cambio no entra.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: ./mvnw verify
        run: ./mvnw -B -ntp verify
